<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Somna - 朝の睡眠サイエンス</title>
  
  <!-- iOS ホーム画面Web Clip（PWA）対応設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Somna">
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- 動的アプリアイコン（JavaScriptで高画質キャンバスからDataURLを注入） -->
  <link id="apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="">
  <link id="favicon" rel="icon" type="image/png" sizes="32x32" href="">

  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans JP"', 'sans-serif'],
          },
          colors: {
            night: {
              950: '#070a12',
              900: '#0c1222',
              850: '#11192e',
              800: '#17223b',
              700: '#223254',
            },
            accent: {
              moon: '#f6d365',
              aurora: '#7000ff',
              indigo: '#6366f1',
              cyan: '#38bdf8'
            }
          },
          animation: {
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-6px)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* iOSセーフエリアとスクロールバー制御 */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
    }
    
    .selectable-text {
      user-select: text;
      -webkit-user-select: text;
    }
    
    .glass-card {
      background: rgba(18, 26, 47, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glow-effect {
      box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.35);
    }

    /* カスタムスクロールバー非表示 */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

<body class="bg-night-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased overflow-x-hidden selection:bg-indigo-500 selection:text-white">

  <!-- 背景オーロラグラデーション -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute -top-32 -left-20 w-96 h-96 bg-indigo-600/20 rounded-full blur-[100px] animate-pulse-slow"></div>
    <div class="absolute top-1/3 -right-32 w-96 h-96 bg-purple-600/15 rounded-full blur-[110px]"></div>
    <div class="absolute bottom-10 left-10 w-80 h-80 bg-amber-500/10 rounded-full blur-[90px]"></div>
  </div>

  <!-- アプリメインラッパー (スマホ画面比率で中央配置、デスクトップでも快適) -->
  <div class="relative z-10 w-full max-w-md mx-auto flex-1 flex flex-col px-4 pt-3 pb-24">

    <!-- ヘッダーエリア -->
    <header class="flex items-center justify-between py-3 mb-2">
      <div class="flex items-center space-x-3">
        <!-- アプリアイコンプレビュー -->
        <div class="w-10 h-10 rounded-xl overflow-hidden shadow-lg border border-white/20 flex-shrink-0 animate-float">
          <canvas id="iconPreviewCanvas" width="80" height="80" class="w-full h-full"></canvas>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-100 to-indigo-200 bg-clip-text text-transparent flex items-center gap-1.5 whitespace-nowrap">
            Somna
            <span id="deliveryBadge" class="text-xs font-medium tracking-normal px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 whitespace-nowrap">07:30 配信</span>
          </h1>
          <p id="todayDateLabel" class="text-xs text-slate-400 font-medium whitespace-nowrap"></p>
        </div>
      </div>

      <!-- アクションボタン群 -->
      <div class="flex items-center space-x-2">
        <button id="refreshTopicsBtn" class="p-2 rounded-xl glass-pill hover:bg-white/10 active:scale-95 transition-all text-slate-300 hover:text-cyan-300 relative" title="最新の睡眠研究トピックに更新">
          <svg id="refreshIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
        </button>
        <button id="notifySettingBtn" class="p-2 rounded-xl glass-pill hover:bg-white/10 active:scale-95 transition-all text-slate-300 hover:text-white relative" title="配信時間・通知設定">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 今日の3つの知識メインセクション -->
    <main class="flex-1 flex flex-col space-y-4">
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center space-x-2">
          <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
          <h2 class="text-sm font-semibold text-slate-200 tracking-wide uppercase whitespace-nowrap">Today's 3 Pillars</h2>
        </div>
        <span id="topicSourceStatus" class="text-xs text-cyan-300/80 font-normal whitespace-nowrap">最新査読論文より日替わり抽出</span>
      </div>

      <!-- 3枚の知識カードリスト -->
      <div id="knowledgeCardsContainer" class="space-y-4">
        <!-- JSで動的レンダリング -->
      </div>

      <!-- 未配信残数・配信済みステータス -->
      <div id="poolStatusCard" class="text-center pt-2 pb-1">
        <p class="text-xs text-slate-300 font-medium">
          既配信: <span id="deliveredCount" class="text-indigo-300 font-semibold font-mono">0</span> 件 ／ 未配信ストック: <span id="remainingCount" class="text-cyan-300 font-semibold font-mono">0</span> 件
        </p>
      </div>
    </main>

  </div>

  <!-- 下部固定タブナビゲーション -->
  <nav class="fixed bottom-0 inset-x-0 z-40 bg-night-900/80 backdrop-blur-xl border-t border-white/10 max-w-md mx-auto">
    <div class="flex items-center justify-around py-3 px-6">
      <button id="tabToday" class="tab-btn flex flex-col items-center space-y-1 text-indigo-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
        <span class="text-xs font-semibold">今日の3選</span>
      </button>

      <button id="tabArchive" class="tab-btn flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
        </svg>
        <span class="text-xs font-semibold">知恵録</span>
      </button>

      <button id="tabBookmarks" class="tab-btn flex flex-col items-center space-y-1 text-slate-400 hover:text-slate-200">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
        </svg>
        <span class="text-xs font-semibold">保存済み</span>
      </button>
    </div>
  </nav>

  <!-- 配信時間・通知設定モーダル -->
  <div id="notifyModal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-night-900 border border-white/10 rounded-3xl w-full max-w-sm p-6 text-center space-y-4 shadow-2xl">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-300">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>

      <div>
        <h3 class="text-lg font-bold text-white">配信時刻・通知設定</h3>
        <p class="text-xs text-slate-300 mt-1 leading-relaxed">
          あなたのライフスタイルに合わせて、毎日の睡眠知識が届く時間を自由に設定できます。
        </p>
      </div>

      <!-- 時刻選択フォーム -->
      <div class="bg-night-850 rounded-2xl p-4 border border-white/5 space-y-3">
        <label class="block text-xs font-semibold text-slate-300 text-left">
          毎日の配信希望時刻
        </label>
        
        <div class="flex items-center justify-center space-x-2">
          <input type="time" id="deliveryTimeInput" value="07:30" class="bg-night-950 border border-indigo-500/30 text-white font-mono text-xl rounded-xl px-4 py-2 text-center focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400">
        </div>

        <!-- おすすめプリセットボタン -->
        <div class="pt-1">
          <div class="text-[11px] text-slate-400 mb-1.5 text-left">💡 おすすめ時間帯</div>
          <div class="grid grid-cols-3 gap-1.5 text-xs">
            <button type="button" onclick="selectPresetTime('07:30')" class="px-2 py-1.5 bg-indigo-500/20 hover:bg-indigo-500/30 rounded-lg text-indigo-300 border border-indigo-500/30 transition-all text-center">
              07:30 <span class="block text-[9px] text-indigo-400">朝の光・起床 (標準)</span>
            </button>
            <button type="button" onclick="selectPresetTime('13:00')" class="px-2 py-1.5 bg-white/5 hover:bg-white/10 rounded-lg text-slate-300 border border-white/5 transition-all text-center">
              13:00 <span class="block text-[9px] text-slate-400">昼休み・午後</span>
            </button>
            <button type="button" onclick="selectPresetTime('20:30')" class="px-2 py-1.5 bg-white/5 hover:bg-white/10 rounded-lg text-slate-300 border border-white/5 transition-all text-center">

          </div>
        </div>
      </div>

        <button onclick="toggleModal('notifyModal', false)" class="w-1/3 py-2.5 bg-white/10 hover:bg-white/15 text-slate-300 rounded-xl text-xs font-semibold">閉じる</button>

      </div>

      <div class="pt-2 border-t border-white/5">
        <button type="button" onclick="confirmResetHistory()" class="text-[11px] text-slate-400 hover:text-rose-300 transition-colors">
          ※ 配信履歴（重複除外データ）を初期化する
        </button>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->

    <div id="toastMsg" class="flex-1"></div>
  </div>

    /* 配信済みIDの永続管理キー */
    const STORAGE_DELIVERED_KEY = 'somna_delivered_unique_ids';
    const STORAGE_DAILY_MAP_KEY = 'somna_daily_delivered_map';

    /* ローカルストレージから過去に配信されたIDを取得 */
    function getDeliveredHistory() {
      try {
        const stored = localStorage.getItem(STORAGE_DELIVERED_KEY);
        return stored ? JSON.parse(stored) : [];
      } catch (e) {
        return [];
      }
    }

    /* 配信履歴を保存 */
    function saveDeliveredHistory(idList) {
      try {
        localStorage.setItem(STORAGE_DELIVERED_KEY, JSON.stringify(idList));
      } catch (e) {}
    }

    /* 日付ごとの配信マッピングを取得 */
    function getDailyMap() {
      try {
        const stored = localStorage.getItem(STORAGE_DAILY_MAP_KEY);
        return stored ? JSON.parse(stored) : {};
      } catch (e) {
        return {};
      }
    }

    function saveDailyMap(map) {
      try {
        localStorage.setItem(STORAGE_DAILY_MAP_KEY, JSON.stringify(map));
      } catch (e) {}
    }

    /* アプリ状態 */
    let deliveryHour = 7;
    let deliveryMinute = 30;
    let savedBookmarks = new Set();
    let currentTab = 'today';

    function formatTimeDisplay(hour, minute) {
      return `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
    }

    /* 配信サイクルに応じた日付キーを計算 */
    function getCycleDateKey() {
      const now = new Date();
      const currentHour = now.getHours();
      const currentMinute = now.getMinutes();
      const isPastDelivery = (currentHour > deliveryHour) || (currentHour === deliveryHour && currentMinute >= deliveryMinute);
      
      const targetDate = new Date(now);
      if (!isPastDelivery) {
        targetDate.setDate(targetDate.getDate() - 1);
      }

      const y = targetDate.getFullYear();
      const m = String(targetDate.getMonth() + 1).padStart(2, '0');
      const d = String(targetDate.getDate()).padStart(2, '0');
      const days = ['日', '月', '火', '水', '木', '金', '土'];

      return {
        key: `${y}-${m}-${d}`,
        formatted: `${y}年${m}月${d}日 (${days[targetDate.getDay()]})`
      };
    }

    /* 一度配信した内容は二度と使わない選出ロジック */
    function getDailyNonRepeatingThreeTips(forceNewSet = false) {
      const { key } = getCycleDateKey();
      const dailyMap = getDailyMap();
      let deliveredHistory = getDeliveredHistory();

      // 本日のサイクルで既に配信した記録が存在し、強制更新でない場合はそれをそのまま返す
      if (!forceNewSet && dailyMap[key] && dailyMap[key].length === 3) {
        const todaysTips = dailyMap[key].map(id => SLEEP_KNOWLEDGE_BASE.find(t => t.id === id)).filter(Boolean);
        if (todaysTips.length === 3) {
          updatePoolCounter(deliveredHistory.length);
          return todaysTips;
        }
      }

      // 過去に配信されたことのない（二度と使わない）未配信プールを抽出
      const deliveredSet = new Set(deliveredHistory);
      let unDeliveredPool = SLEEP_KNOWLEDGE_BASE.filter(item => !deliveredSet.has(item.id));

      // 万が一全トピックを配信し尽くした場合は自動で再循環案内
      if (unDeliveredPool.length < 3) {
        deliveredHistory = [];
        saveDeliveredHistory([]);
        unDeliveredPool = [...SLEEP_KNOWLEDGE_BASE];
        showToast('全ストックの配信を完了しました。新サイクルを開始します', true);
      }

      // 未配信プールからランダムに重複なく3つを抽出
      const shuffled = [...unDeliveredPool].sort(() => 0.5 - Math.random());
      const selectedThree = shuffled.slice(0, 3);
      const selectedIds = selectedThree.map(t => t.id);

      // 配信済み履歴に永久記録（二度と再登場させない）
      deliveredHistory.push(...selectedIds);
      saveDeliveredHistory(deliveredHistory);

      // 本日サイクルの配信データとして記録
      dailyMap[key] = selectedIds;
      saveDailyMap(dailyMap);

      updatePoolCounter(deliveredHistory.length);
      return selectedThree;
    }

    /* 残り未配信件数と既配信件数の表示更新 */
    function updatePoolCounter(deliveredCount) {
      const total = SLEEP_KNOWLEDGE_BASE.length;
      const countEl = document.getElementById('deliveredCount');
      const remEl = document.getElementById('remainingCount');
      if (countEl) countEl.textContent = deliveredCount;
      if (remEl) remEl.textContent = Math.max(0, total - deliveredCount);
    }

    /* 配信履歴のリセット確認 */
    function confirmResetHistory() {
      if (window.confirm ? true : true) {
        localStorage.removeItem(STORAGE_DELIVERED_KEY);
        localStorage.removeItem(STORAGE_DAILY_MAP_KEY);
        showToast('配信履歴を初期化しました');
        toggleModal('notifyModal', false);
        refreshCurrentView();
      }
    }

    /* キャンバスアプリアイコン描画 */
    function generateAppIcon(hour = 7, minute = 30) {
      const size = 180;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, size, size);
      bgGrad.addColorStop(0, '#0f172a');
      bgGrad.addColorStop(0.5, '#1e1b4b');
      bgGrad.addColorStop(1, '#31104b');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, size, size);

      const glowGrad = ctx.createRadialGradient(size * 0.7, size * 0.3, 5, size * 0.7, size * 0.3, 70);
      glowGrad.addColorStop(0, 'rgba(246, 211, 101, 0.45)');
      glowGrad.addColorStop(1, 'rgba(246, 211, 101, 0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(size * 0.7, size * 0.3, 70, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.shadowColor = 'rgba(250, 204, 21, 0.6)';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#fde68a';
      ctx.beginPath();
      ctx.arc(size * 0.48, size * 0.50, 44, 0, Math.PI * 2, true);
      ctx.fill();

      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(size * 0.60, size * 0.42, 40, 0, Math.PI * 2, true);
      ctx.fill();
      ctx.restore();

      function drawDiamondStar(cx, cy, r, alpha) {
        ctx.save();
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.shadowColor = '#818cf8';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(cx, cy - r);
        ctx.quadraticCurveTo(cx, cy, cx + r, cy);
        ctx.quadraticCurveTo(cx, cy, cx, cy + r);
        ctx.quadraticCurveTo(cx, cy, cx - r, cy);
        ctx.quadraticCurveTo(cx, cy, cx, cy - r);
        ctx.fill();
        ctx.restore();
      }

      drawDiamondStar(size * 0.72, size * 0.32, 10, 0.95);
      drawDiamondStar(size * 0.30, size * 0.70, 6, 0.75);
      drawDiamondStar(size * 0.25, size * 0.30, 4, 0.6);

      ctx.strokeStyle = 'rgba(129, 140, 248, 0.6)';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';

      const cx = size * 0.5;
      const cy = size * 0.5;

      const hourAngle = ((hour % 12) + minute / 60) * (Math.PI / 6) - Math.PI / 2;
      const hourLength = size * 0.18;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(hourAngle) * hourLength, cy + Math.sin(hourAngle) * hourLength);
      ctx.stroke();

      const minuteAngle = minute * (Math.PI / 30) - Math.PI / 2;
      const minuteLength = size * 0.25;
      ctx.strokeStyle = 'rgba(199, 210, 254, 0.8)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(minuteAngle) * minuteLength, cy + Math.sin(minuteAngle) * minuteLength);
      ctx.stroke();

      const iconDataUrl = canvas.toDataURL('image/png');

      const appleTouch = document.getElementById('apple-touch-icon');
      if (appleTouch) appleTouch.href = iconDataUrl;
      const fav = document.getElementById('favicon');
      if (fav) fav.href = iconDataUrl;

      const previewCanvas = document.getElementById('iconPreviewCanvas');
      if (previewCanvas) {
        const pCtx = previewCanvas.getContext('2d');
        pCtx.clearRect(0, 0, 80, 80);
        pCtx.drawImage(canvas, 0, 0, 80, 80);
      }
    }

    function selectPresetTime(timeStr) {
      const input = document.getElementById('deliveryTimeInput');
      if (input) input.value = timeStr;
    }

    function renderKnowledgeCards(tipsList, isBookmarkView = false) {
      const container = document.getElementById('knowledgeCardsContainer');
      container.innerHTML = '';

      if (tipsList.length === 0) {
        container.innerHTML = `
          <div class="glass-card rounded-2xl p-8 text-center space-y-3">
            <div class="text-4xl">🌙</div>
            <div class="text-base font-semibold text-slate-200">${isBookmarkView ? '保存された知見はありません' : '配信データがありません'}</div>
            <p class="text-sm text-slate-400">カード右上のしおりアイコンを押すと、いつでも見返せるようにここにストックされます。</p>
          </div>
        `;
        return;
      }

      tipsList.forEach((tip, idx) => {
        const isBookmarked = savedBookmarks.has(tip.id);
        const card = document.createElement('article');
        card.className = "glass-card rounded-3xl p-5 border border-white/10 hover:border-indigo-500/40 transition-all duration-300 relative overflow-hidden group";

        card.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center space-x-2">
              <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full border whitespace-nowrap ${tip.categoryColor}">
                ${tip.category}
              </span>
              <span class="text-xs text-slate-400 font-mono">No.0${idx + 1}</span>
            </div>
            <div class="flex items-center space-x-1.5 flex-shrink-0">
              <button onclick="copyFullTip('${tip.id}')" class="inline-flex items-center space-x-1 text-[11px] text-indigo-200 bg-indigo-500/20 hover:bg-indigo-500/35 border border-indigo-500/35 px-2.5 py-1 rounded-xl transition-all active:scale-95 whitespace-nowrap" title="タイトル・解説・Action・出典を改行なしでまとめてコピー">
                <svg class="w-3.5 h-3.5 text-indigo-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                </svg>
                <span>内容をコピー</span>
              </button>
              <button onclick="toggleBookmark('${tip.id}')" class="p-1.5 rounded-xl text-slate-300 hover:text-amber-400 hover:bg-white/10 active:scale-90 transition-all" title="ブックマーク">
                <svg class="w-4 h-4 ${isBookmarked ? 'fill-amber-400 text-amber-400' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                </svg>
              </button>
            </div>
          </div>

          <div class="flex items-start space-x-3 mb-2.5">
            <span class="text-2xl flex-shrink-0 pt-0.5">${tip.icon}</span>
            <h3 class="text-base font-bold text-slate-100 leading-snug tracking-tight">${tip.title}</h3>
          </div>

          <p class="text-sm text-slate-200 leading-relaxed mb-4 pl-9">
            ${tip.summary}
          </p>

          <div class="bg-indigo-950/40 border border-indigo-500/20 rounded-2xl p-3 mb-4 flex items-start space-x-2.5">
            <span class="text-[11px] font-bold text-indigo-300 uppercase tracking-wider bg-indigo-500/20 px-2 py-0.5 rounded flex-shrink-0 mt-0.5 whitespace-nowrap">Action</span>
            <p class="text-sm text-indigo-100 font-medium leading-relaxed">${tip.action}</p>
          </div>

          <div class="bg-night-950/70 border border-white/5 rounded-2xl p-3.5 text-xs text-slate-300 font-sans">
            <div class="flex items-center justify-between gap-2 mb-2">
              <div class="flex items-center space-x-1.5 text-indigo-300 font-semibold text-xs whitespace-nowrap">
                <svg class="w-3.5 h-3.5 text-indigo-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
                <span>出典・査読論文</span>
              </div>
              <div class="flex items-center space-x-1.5 flex-shrink-0">
                <button type="button" onclick="copyCitation('${tip.id}')" class="inline-flex items-center space-x-1 text-[11px] text-slate-200 bg-white/10 hover:bg-white/15 active:scale-95 border border-white/15 px-2 py-1 rounded-lg transition-all whitespace-nowrap" title="出典をコピー">
                  <svg class="w-3 h-3 text-slate-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                  </svg>
                  <span>出典コピー</span>
                </button>
                <a href="${tip.citation.url || ('https://doi.org/' + tip.citation.doi)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center space-x-1 text-[11px] text-indigo-200 bg-indigo-500/25 hover:bg-indigo-500 hover:text-white border border-indigo-500/40 px-2 py-1 rounded-lg transition-all active:scale-95 whitespace-nowrap">
                  <span>Safariで開く</span>
                  <svg class="w-2.5 h-2.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                  </svg>
                </a>
              </div>
            </div>

            <div class="selectable-text select-text cursor-text bg-black/25 rounded-xl p-3 border border-white/5 space-y-1.5">
              <div class="text-slate-100 font-semibold text-xs sm:text-sm leading-snug">${tip.citation.journal}</div>
              <div class="text-slate-200 text-xs italic leading-relaxed">“${tip.citation.title}”</div>
              <div class="text-slate-300 text-xs flex flex-wrap justify-between gap-1.5 pt-1.5 border-t border-white/5">
                <span>著者: ${tip.citation.authors}</span>
                <span class="font-mono text-indigo-300">DOI: ${tip.citation.doi}</span>
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function showToast(message, isSuccess = true) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.textContent = message;
      toastIcon.textContent = isSuccess ? '✓' : 'ℹ';
      toastIcon.className = `w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 ${isSuccess ? 'bg-indigo-500/20 text-indigo-300' : 'bg-amber-500/20 text-amber-300'}`;

      toast.classList.remove('-translate-y-24', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.add('-translate-y-24', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 2500);
    }

    function copyCitation(tipId) {
      const tip = SLEEP_KNOWLEDGE_BASE.find(t => t.id === tipId);
      if (!tip || !tip.citation) return;

      const citationText = `${tip.citation.authors}. "${tip.citation.title}". ${tip.citation.journal}. DOI: ${tip.citation.doi} (${tip.citation.url || ('https://doi.org/' + tip.citation.doi)})`;

      const textArea = document.createElement("textarea");
      textArea.value = citationText;
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showToast('出典・文献情報をコピーしました！');
      } catch (err) {
        showToast('コピーに失敗しました', false);
      }
      document.body.removeChild(textArea);
    }

    /* タイトル・解説・Action・出典を改行なしの連続テキストとしてクリップボードへコピー（【睡眠知識】なし） */
    function copyFullTip(tipId) {
      const tip = SLEEP_KNOWLEDGE_BASE.find(t => t.id === tipId);
      if (!tip) return;

      const citationUrl = tip.citation.url || ('https://doi.org/' + tip.citation.doi);
      
      // 改行を一切含まない1行の連続テキスト形式（先頭の【睡眠知識】を除外）
      const cleanTitle = (tip.title || '').replace(/\r?\n/g, ' ').trim();
      const cleanSummary = (tip.summary || '').replace(/\r?\n/g, ' ').trim();
      const cleanAction = (tip.action || '').replace(/\r?\n/g, ' ').trim();
      const fullText = `${cleanTitle} 【解説】${cleanSummary} 【Action】${cleanAction} 【出典】${tip.citation.journal}（${tip.citation.authors}）「${tip.citation.title}」DOI: ${tip.citation.doi} (${citationUrl})`;

      const textArea = document.createElement("textarea");
      textArea.value = fullText;
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showToast('改行なしで内容をコピーしました！');
      } catch (err) {
        showToast('コピーに失敗しました', false);
      }
      document.body.removeChild(textArea);
    }

    function toggleBookmark(tipId) {
      if (savedBookmarks.has(tipId)) {
        savedBookmarks.delete(tipId);
        showToast('ブックマークから削除しました');
      } else {
        savedBookmarks.add(tipId);
        showToast('知見を保存しました！');
      }
      refreshCurrentView();
    }

    function toggleModal(modalId, show) {
      const modal = document.getElementById(modalId);
      if (show) {
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    /* 画面切り替え（二度と使わないロジックの適用） */
    function refreshCurrentView(forceNew = false) {
      if (currentTab === 'today') {
        const todaysThree = getDailyNonRepeatingThreeTips(forceNew);
        renderKnowledgeCards(todaysThree, false);
      } else if (currentTab === 'archive') {
        const deliveredIds = getDeliveredHistory();
        const deliveredTips = deliveredIds.map(id => SLEEP_KNOWLEDGE_BASE.find(t => t.id === id)).filter(Boolean);
        renderKnowledgeCards(deliveredTips.length > 0 ? deliveredTips : SLEEP_KNOWLEDGE_BASE, false);
      } else if (currentTab === 'bookmarks') {
        const bookmarkedTips = SLEEP_KNOWLEDGE_BASE.filter(t => savedBookmarks.has(t.id));
        renderKnowledgeCards(bookmarkedTips, true);
      }
    }

    /* 手動リフレッシュ時も過去の知見を二度と使わず完全新規トピックを抽出 */
    async function triggerLatestTopicsRefresh() {
      const icon = document.getElementById('refreshIcon');
      const statusLabel = document.getElementById('topicSourceStatus');

      if (icon) icon.classList.add('animate-spin');
      if (statusLabel) statusLabel.textContent = '未配信の最新トピックを取得中...';

      await new Promise(r => setTimeout(r, 500));

      refreshCurrentView(true);

      if (icon) icon.classList.remove('animate-spin');
      if (statusLabel) statusLabel.textContent = '最新査読論文より日替わり抽出';
      showToast('過去配信と重複のない新しい3選に更新しました！');
    }

    function setupTabs() {
      const tabs = [
        { id: 'tabToday', view: 'today' },
        { id: 'tabArchive', view: 'archive' },
        { id: 'tabBookmarks', view: 'bookmarks' },
      ];

      tabs.forEach(t => {
        const btn = document.getElementById(t.id);
        if (!btn) return;
        btn.addEventListener('click', () => {
          currentTab = t.view;
          document.querySelectorAll('.tab-btn').forEach(b => {
            b.classList.remove('text-indigo-400');
            b.classList.add('text-slate-400');
          });
          btn.classList.add('text-indigo-400');
          btn.classList.remove('text-slate-400');
          refreshCurrentView(false);
        });
      });
    }

    function setupDeliveryTimeFeature() {
      const saveBtn = document.getElementById('saveTimeSettingBtn');
      const timeInput = document.getElementById('deliveryTimeInput');

      saveBtn.addEventListener('click', async () => {
        if (timeInput && timeInput.value) {
          const parts = timeInput.value.split(':');
          deliveryHour = parseInt(parts[0], 10);
          deliveryMinute = parseInt(parts[1], 10);

          const timeStr = formatTimeDisplay(deliveryHour, deliveryMinute);
          
          document.getElementById('deliveryBadge').textContent = `${timeStr} 配信`;
          generateAppIcon(deliveryHour, deliveryMinute);

          if ('Notification' in window && Notification.permission === 'default') {
            try {
              await Notification.requestPermission();
            } catch (e) {}
          }

          showToast(`毎日の配信時刻を ${timeStr} に変更しました！`);
          toggleModal('notifyModal', false);
          refreshCurrentView(false);
        }
      });
    }

    window.onload = function() {
      generateAppIcon(deliveryHour, deliveryMinute);

      const cycle = getCycleDateKey();
      document.getElementById('todayDateLabel').textContent = cycle.formatted;

      setupTabs();
      setupDeliveryTimeFeature();

      refreshCurrentView(false);

      const refreshBtn = document.getElementById('refreshTopicsBtn');
      if (refreshBtn) {
        refreshBtn.addEventListener('click', triggerLatestTopicsRefresh);
      }

      document.getElementById('notifySettingBtn').addEventListener('click', () => {
        toggleModal('notifyModal', true);
      });
    };
  </script>
</body>
</html>
